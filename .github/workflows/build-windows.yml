name: Private candidate native verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 70
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Create ephemeral encrypted-transport session
        run: |
          New-Item -Path .private -ItemType Directory | Out-Null
          $rsa = [Security.Cryptography.RSA]::Create(3072)
          try {
            [IO.File]::WriteAllText((Join-Path $PWD '.private/transport-private.pem'), $rsa.ExportPkcs8PrivateKeyPem())
            [IO.File]::WriteAllText((Join-Path $PWD 'transport-public.pem'), $rsa.ExportSubjectPublicKeyInfoPem())
          } finally { $rsa.Dispose() }
          @{run_id=$env:GITHUB_RUN_ID;algorithm='RSA3072-OAEP-SHA256';head=$env:GITHUB_SHA} |
            ConvertTo-Json | Set-Content transport-public.json
      - name: Publish public transport identity only
        uses: actions/upload-artifact@v4
        with:
          name: transport-public-key
          path: |
            transport-public.pem
            transport-public.json
          retention-days: 1
      - name: Wait for authenticated encrypted source inbox
        run: |
          $found = $false
          for ($i = 0; $i -lt 180; $i++) {
            & git fetch --depth=1 origin $env:GITHUB_REF_NAME 2>&1 | Out-Null
            if ($LASTEXITCODE -eq 0) {
              $entry = & git ls-tree --name-only FETCH_HEAD -- ci/inbox/envelope.json
              if ($entry) {
                & git checkout FETCH_HEAD -- ci/inbox
                if ($LASTEXITCODE -ne 0) { throw 'Source inbox checkout failed' }
                $envelope = Get-Content ci/inbox/envelope.json -Raw | ConvertFrom-Json
                if ([string]$envelope.run_id -eq [string]$env:GITHUB_RUN_ID) { $found = $true; break }
              }
            }
            Start-Sleep -Seconds 10
          }
          if (-not $found) { throw 'No source delivered for this native session' }
          if ($envelope.parts) {
            $stream = [IO.File]::Open((Join-Path $PWD 'ci/inbox/source.cap'), [IO.FileMode]::CreateNew)
            try {
              foreach ($part in $envelope.parts) {
                if ($part -notmatch '^source\.part-[0-9]{3}\.cap$') { throw 'Unsafe encrypted chunk name' }
                $input = [IO.File]::OpenRead((Join-Path $PWD "ci/inbox/$part"))
                try { $input.CopyTo($stream) } finally { $input.Dispose() }
              }
            } finally { $stream.Dispose() }
          }
          $actual = (Get-FileHash ci/inbox/source.cap -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $envelope.capsule_sha256) { throw 'Encrypted source integrity mismatch' }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Open private source envelope
        run: |
          & ./ci/capsule.ps1 -Mode decrypt -InputFile ci/inbox/source.cap -OutputFile private-source.zip
          Expand-Archive -LiteralPath private-source.zip -DestinationPath .private -Force
          Get-Content .private/mask-values.txt | ForEach-Object { if ($_.Length -gt 3) { Write-Output "::add-mask::$_" } }
      - name: Apply authenticated candidate update
        run: |
          $envelope = Get-Content ci/inbox/envelope.json -Raw | ConvertFrom-Json
          if ($envelope.patch_sha256) {
            $actual = (Get-FileHash ci/inbox/update.cap).Hash.ToLowerInvariant()
            if ($actual -ne $envelope.patch_sha256) { throw 'Encrypted update integrity mismatch' }
            & ./ci/capsule.ps1 -Mode decrypt -InputFile ci/inbox/update.cap -OutputFile private-update.zip
            Expand-Archive -LiteralPath private-update.zip -DestinationPath .private -Force
            Get-Content .private/mask-values.txt | ForEach-Object { if ($_.Length -gt 3) { Write-Output "::add-mask::$_" } }
          }
      - name: Native Windows build and verification
        run: '& ./ci/verify-native.ps1 -SourceRoot .private/source -OutDir .private/result'
      - name: Encrypt actual build and test evidence
        if: always()
        run: |
          if (Test-Path .private/result) {
            Compress-Archive -Path .private/result/* -DestinationPath private-result.zip
            & ./ci/capsule.ps1 -Mode encrypt -InputFile private-result.zip -OutputFile candidate-result.cap
            @{format='QPCICAP1';sha256=(Get-FileHash candidate-result.cap).Hash.ToLowerInvariant();run_id=$env:GITHUB_RUN_ID} |
              ConvertTo-Json | Set-Content capsule-manifest.json
          } else { throw 'No actual build evidence produced' }
      - name: Upload encrypted candidate only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-native-encrypted
          path: |
            candidate-result.cap
            capsule-manifest.json
          if-no-files-found: error
          retention-days: 7
